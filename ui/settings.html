<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt AnkiVN</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="settings-container">
        <h1>Cài đặt AnkiVN</h1>

        <div class="form-group note-type-selector">
            <label for="settings-model-search">Chọn Note Type để cấu hình:</label>
            <div class="autocomplete-container">
                <input type="text" id="settings-model-search" class="form-control" placeholder="🔍 Gõ để tìm Note Type...">
                <div id="settings-model-suggestions" class="suggestions-container"></div>
            </div>
        </div>

        <!-- Khu vực Ẩn Field -->
        <div class="settings-fields-controls">
             <span>Ẩn Fields (Tích để ẩn):</span>
             <div>
                 <button id="select-all-fields" class="btn-secondary">Ẩn tất cả</button>
                 <button id="deselect-all-fields" class="btn-secondary">Hiện tất cả</button>
             </div>
        </div>
        <div class="settings-fields-list" id="settings-fields-list-container">
             <p><i>Hãy chọn một Note Type ở trên.</i></p>
        </div>

        <!-- [MỚI] Khu vực Ghim Field -->
        <div class="settings-fields-controls sticky-controls">
             <span>📌 Ghim Fields (Giữ lại nội dung sau khi thêm):</span>
             <div>
                 <button id="select-all-sticky-fields" class="btn-secondary">Ghim tất cả</button>
                 <button id="deselect-all-sticky-fields" class="btn-secondary">Bỏ ghim tất cả</button>
             </div>
        </div>
        <div class="settings-fields-list sticky-fields-list" id="settings-sticky-fields-list-container">
             <p><i>Hãy chọn một Note Type ở trên.</i></p>
        </div>
        <!-- [HẾT MỚI] -->


        <div class="random-id-section" id="random-id-section" style="display: none;">
             <label for="random-id-field-select">Tự động tạo ID ngẫu nhiên cho Field:</label>
             <select id="random-id-field-select" class="form-control">
                 <option value="">-- Không tự động tạo ID --</option>
                 </select>
             <p style="font-size: 12px; color: #666; margin-top: 5px;">Chọn field để tự động điền 14 số ngẫu nhiên khi thêm note mới (nếu field đó trống).</p>
        </div>
        
        <button id="save-settings-btn" class="btn-primary">Lưu Cài đặt</button>
        <div id="settings-status" class="status-message" style="margin-top: 15px;"></div>
    </div>

    <script type="module" src="../src/settings/main.js"></script>
</body>
</html>
