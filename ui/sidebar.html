<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkiVN - Muahaha</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Link Font Awesome (nếu bạn chưa có) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="container">

    <!-- Header luôn hiển thị -->
    <div class="header-container">
        <h1 id="main-header-title">AnkiVN - Muahaha</h1>
        <div>
          <!-- Nút Ẩn/Hiện -->
          <a href="#" id="toggle-header-btn" title="Ẩn">▶</a>
          <!-- Nút Thống kê -->
          <a href="#" id="open-stats-link" title="Mở Thống kê">
            <i class="fas fa-chart-bar"></i>
          </a>
          <!-- Nút Cài đặt -->
          <a href="#" id="open-settings-link" title="Mở Cài đặt">
            <i class="fas fa-cog"></i>
          </a>
        </div>
    </div>

    <!-- Phần nội dung có thể thu gọn -->
    <div id="collapsible-header">
      <div id="non-sticky-header-content">
        <div class="form-group inline-group preset-group">
            <label for="preset-select" class="inline-label">Cấu hình:</label>
            <div class="autocomplete-container inline-input-container">
                <select id="preset-select" class="form-control">
                    <option value="">-- Chọn cấu hình --</option>
                </select>
            </div>
            <button id="save-preset-btn" class="btn-secondary btn-icon" title="Lưu cấu hình hiện tại">💾</button>
            <button id="delete-preset-btn" class="btn-secondary btn-icon btn-icon-danger" title="Xóa cấu hình đã chọn">🗑️</button>
        </div>
        <div class="form-group inline-group">
          <label for="deck-search" class="inline-label">Deck:</label>
          <div class="autocomplete-container inline-input-container">
            <input type="text" id="deck-search" class="form-control" placeholder="Tìm Deck...">
            <div id="deck-suggestions" class="suggestions-container"></div>
          </div>
        </div>
        <div class="form-group inline-group">
          <label for="model-search" class="inline-label">Note:</label>
          <div class="autocomplete-container inline-input-container">
            <input type="text" id="model-search" class="form-control" placeholder="Tìm Note Type...">
            <div id="model-suggestions" class="suggestions-container"></div>
          </div>
        </div>
        <div class="form-group inline-group">
          <label for="note-search" class="inline-label">Tải Note:</label>
          <div class="autocomplete-container inline-input-container">
            <input type="text" id="note-search" class="form-control" placeholder="Tìm Note để tải...">
            <div id="note-suggestions" class="suggestions-container"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Hết phần thu gọn -->

    <!-- Toolbar (sticky) -->
    <div id="sticky-toolbar-wrapper">
      <div id="format-toolbar">
        <div class="toolbar-group">
          <button id="format-bold" title="In đậm (Ctrl+B)"><i class="fas fa-bold"></i></button>
          <button id="format-italic" title="In nghiêng (Ctrl+I)"><i class="fas fa-italic"></i></button>
          <button id="format-underline" title="Gạch chân (Ctrl+U)"><i class="fas fa-underline"></i></button>
        </div>
        
        <div class="color-picker-wrapper">
          <button id="format-forecolor" class="color-btn" title="Màu chữ">
            <svg xmlns="http://www.w3.org/2000/svg" id="mdi-color-helper" viewBox="0 0 24 24"><path d="M0,24H24V20H0V24Z"></path></svg>
            <span class="color-swatch" id="forecolor-swatch" style="background-color: #000000;"></span>
          </button>
          <div class="color-picker-dropdown" id="forecolor-dropdown">
            <div class="color-picker-header">Màu chữ</div>
            <div class="saved-colors-section">
              <div class="saved-colors-label">Màu đã dùng:</div>
              <div class="saved-colors-grid" id="saved-forecolors-grid"></div>
            </div>
            <div class="color-picker-content">
              <input type="color" id="forecolor-picker" value="#000000" title="Chọn màu chữ">
              <input type="text" id="forecolor-hex-input" class="hex-color-input" placeholder="#000000" title="Nhập mã màu HEX" maxlength="7">
            </div>
            <button id="apply-forecolor-btn" class="apply-color-btn">Áp dụng</button>
          </div>
        </div>
        
        <div class="color-picker-wrapper">
          <button id="format-backcolor" class="color-btn" title="Màu nền">
            <svg xmlns="http://www.w3.org/2000/svg" id="mdi-format-color-highlight" viewBox="0 0 24 24"><path d="M4,17L6.75,14.25L6.72,14.23C6.14,13.64 6.14,12.69 6.72,12.11L11.46,7.37L15.7,11.61L10.96,16.35C10.39,16.93 9.46,16.93 8.87,16.37L8.24,17H4M15.91,2.91C16.5,2.33 17.45,2.33 18.03,2.91L20.16,5.03C20.74,5.62 20.74,6.57 20.16,7.16L16.86,10.45L12.62,6.21L15.91,2.91Z"></path></svg>
            <span class="color-swatch" id="backcolor-swatch" style="background-color: #ffffff; border: 1px solid #ddd;"></span>
          </button>
          <div class="color-picker-dropdown" id="backcolor-dropdown">
            <div class="color-picker-header">Màu nền</div>
            <div class="saved-colors-section">
              <div class="saved-colors-label">Màu đã dùng:</div>
              <div class="saved-colors-grid" id="saved-backcolors-grid"></div>
            </div>
            <div class="color-picker-content">
              <input type="color" id="backcolor-picker" value="#ffffff" title="Chọn màu nền">
              <input type="text" id="backcolor-hex-input" class="hex-color-input" placeholder="#FFFFFF" title="Nhập mã màu HEX" maxlength="7">
            </div>
            <button id="apply-backcolor-btn" class="apply-color-btn">Áp dụng</button>
          </div>
        </div>
        
        <div class="toolbar-group">
          <button id="format-remove" title="Xóa định dạng"><i class="fas fa-eraser"></i></button>
        </div>
        
        <div class="toolbar-group cloze-group">
          <button id="format-cloze-next" class="cloze-button" title="Thêm Cloze tiếp theo (Ctrl+Shift+C)">C123</button>
        </div>
        
        <div class="toolbar-group">
          <button id="toggle-source-view" title="Xem/Chỉnh sửa Source Code"><i class="fas fa-code"></i></button>
        </div>
      </div>
    </div>


    <!-- Main content view -->
    <div id="main-content-view">
      <div id="fields-container" class="fields-container">
        <!-- Fields sẽ được tạo ở đây -->
      </div>
      <div class="form-group">
        <label for="tags-input">Tags:</label>
        <input type="text" id="tags-input" class="form-control" list="tags-datalist" placeholder="Nhập tags, phân cách bằng dấu cách">
        <datalist id="tags-datalist">
        </datalist>
      </div>
      <div class="form-group floating-button-container">
        <button id="add-note-btn" class="btn-primary">Thêm</button>
      </div>
      <div id="status-message" class="status-message"></div>
      <div id="image-preview-modal" class="modal">
        <span class="modal-close-btn">&times;</span>
        <img class="modal-content" id="modal-image">
        <div id="modal-caption"></div>
      </div>
    </div>
    
    <div id="stats-view" style="display: none;">
      <iframe id="stats-iframe" src="stats.html" frameborder="0"></iframe>
    </div>
    
    <div id="settings-view" style="display: none;">
      <iframe id="settings-iframe" src="settings.html" frameborder="0"></iframe>
    </div>
  </div>
  <script type="module" src="../src/sidebar/main.js"></script>
</body>
</html>
