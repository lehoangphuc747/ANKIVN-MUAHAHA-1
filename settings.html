<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt AnkiVN</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { width: auto; min-width: 450px; } /* Tăng chiều rộng tối thiểu */
        .settings-container { padding: 20px; }
        .note-type-selector { margin-bottom: 20px; }
        #save-settings-btn { margin-top: 20px; }
        /* Style autocomplete trong settings giống popup */
        .autocomplete-container { position: relative; }
        .suggestions-container { display: none; position: absolute; background-color: white; border: 1px solid #ddd; border-top: none; border-radius: 0 0 6px 6px; width: 100%; box-sizing: border-box; max-height: 150px; overflow-y: auto; z-index: 1000; }
        .suggestion-item { padding: 8px 10px; font-size: 14px; cursor: pointer; } /* Giảm padding một chút */
        .suggestion-item:hover, .suggestion-item.active { background-color: #f0f0f0; }

        /* [THÊM MỚI] Style cho 2 cột và nút chọn */
        .settings-fields-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .settings-fields-controls span {
            font-weight: 500;
        }
        .settings-fields-controls button {
            padding: 4px 8px;
            font-size: 12px;
            margin-left: 5px;
            cursor: pointer;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .settings-fields-controls button:hover {
             background-color: #ddd;
        }

        .settings-fields-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Tạo 2 cột */
            gap: 0 20px; /* Khoảng cách giữa các cột */
            max-height: 400px; /* Tăng chiều cao tối đa */
            overflow-y: auto;
        }
        .field-checkbox-group {
            margin-bottom: 8px; /* Giảm khoảng cách */
            display: flex;
            align-items: center;
        }
        .field-checkbox-group input[type="checkbox"] {
             margin-right: 8px; /* Khoảng cách giữa checkbox và label */
        }
        .field-checkbox-group label {
            margin-bottom: 0; /* Ghi đè margin */
            white-space: nowrap; /* Ngăn label xuống dòng */
            overflow: hidden;
            text-overflow: ellipsis; /* Thêm ... nếu label quá dài */
        }
         /* Scrollbar cho list */
        .settings-fields-list::-webkit-scrollbar { width: 5px; }
        .settings-fields-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        .settings-fields-list::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        .settings-fields-list::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div class="settings-container">
        <h1>Cài đặt ẩn Fields</h1>
        <p>Chọn Note Type, sau đó tích vào các field bạn muốn ẩn mặc định trong sidebar.</p>

        <div class="form-group note-type-selector">
            <label for="settings-model-search">Chọn Note Type để cấu hình:</label>
            <div class="autocomplete-container">
                <input type="text" id="settings-model-search" class="form-control" placeholder="🔍 Gõ để tìm Note Type...">
                <div id="settings-model-suggestions" class="suggestions-container"></div>
            </div>
        </div>

        <div class="settings-fields-controls">
             <span>Fields (Tích để ẩn):</span>
             <div>
                 <button id="select-all-fields">Chọn tất cả</button>
                 <button id="deselect-all-fields">Bỏ chọn tất cả</button>
             </div>
        </div>
        <div class="settings-fields-list" id="settings-fields-list-container">
             <p><i>Hãy chọn một Note Type ở trên.</i></p>
            </div>
        <button id="save-settings-btn" class="btn-primary">Lưu Cài đặt</button>
        <div id="settings-status" class="status-message" style="margin-top: 15px;"></div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
