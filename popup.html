<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkiVN - Muahaha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>AnkiVN - Muahaha</h1>
    
    <div class="form-group">
      <label for="deck-select">Chọn Deck:</label>
      <input type="text" id="deck-search" class="form-control search-input" placeholder="🔍 Tìm Deck...">
      <select id="deck-select" class="form-control">
        <option value="">-- Chọn Deck --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="model-select">Chọn Note Type:</label>
      <input type="text" id="model-search" class="form-control search-input" placeholder="🔍 Tìm Note Type...">
      <select id="model-select" class="form-control">
        <option value="">-- Chọn Note Type --</option>
      </select>
    </div>

    <div id="fields-container" class="fields-container">
      </div>

    <div class="form-group">
      <label for="tags-input">Nhập Tags:</label>
      <input type="text" id="tags-input" class="form-control" list="tags-datalist" placeholder="Nhập tags, phân cách bằng dấu cách">
      <datalist id="tags-datalist">
        </datalist>
    </div>

    <div class="form-group">
      <button id="add-note-btn" class="btn-primary">Thêm vào Anki</button>
    </div>

    <div id="status-message" class="status-message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
