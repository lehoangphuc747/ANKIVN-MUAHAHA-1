<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkiVN - Muahaha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>AnkiVN - Muahaha</h1>
    
    <div class="form-group">
      <label for="deck-search">Chọn Deck:</label>
      <div class="autocomplete-container">
        <input type="text" id="deck-search" class="form-control" placeholder="🔍 Gõ để tìm Deck...">
        <div id="deck-suggestions" class="suggestions-container"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="model-search">Chọn Note Type:</label>
      <div class="autocomplete-container">
        <input type="text" id="model-search" class="form-control" placeholder="🔍 Gõ để tìm Note Type...">
        <div id="model-suggestions" class="suggestions-container"></div>
      </div>
    </div>

    <div id="fields-container" class="fields-container">
      </div>

    <div class="form-group">
      <label for="tags-input">Nhập Tags:</label>
      <input type="text" id="tags-input" class="form-control" list="tags-datalist" placeholder="Nhập tags, phân cách bằng dấu cách">
      <datalist id="tags-datalist">
        </datalist>
    </div>

    <div class="form-group">
      <button id="add-note-btn" class="btn-primary">Thêm vào Anki</button>
    </div>

    <div id="status-message" class="status-message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
